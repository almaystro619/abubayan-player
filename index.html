<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قنوات ابوبيان الشماخي</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#080b12;
    --panel:#101621;
    --panel2:#151d2b;
    --text:#fff;
    --muted:#98a4b7;
    --accent:#e50914;
    --accent2:#ff8a00;
    --border:rgba(255,255,255,.09);
}

html{scroll-behavior:smooth}

body{
    margin:0;
    background:
        radial-gradient(circle at 50% -10%,rgba(229,9,20,.18),transparent 35%),
        linear-gradient(180deg,#080b12 0%,#0b0f17 100%);
    color:var(--text);
    font-family:Arial,"Tahoma",sans-serif;
    min-height:100vh;
}

/* ===== المشغل العلوي ===== */
.player{
    position:sticky;
    top:0;
    z-index:999;
    padding:8px;
    background:rgba(8,11,18,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    box-shadow:0 8px 30px rgba(0,0,0,.45);
}

.video-container{
    position:relative;
    width:100%;
    max-width:1100px;
    margin:auto;
    background:#000;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    overflow:hidden;
    box-shadow:
        0 0 0 1px rgba(229,9,20,.06),
        0 15px 45px rgba(0,0,0,.55);
}

.video-container::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:14px;
    box-shadow:inset 0 0 45px rgba(0,0,0,.35);
}

video{
    width:100%;
    max-height:58vh;
    min-height:220px;
    display:block;
    background:#000;
    object-fit:contain;
}

/* ===== الشعار ===== */
.logo-link{
    position:absolute;
    top:12px;
    left:12px;
    z-index:20;
    width:62px;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    overflow:hidden;
    background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 5px 20px rgba(0,0,0,.45);
    transition:.25s;
}

.logo-link:hover{
    transform:scale(1.06);
    border-color:rgba(255,255,255,.55);
}

.logo-link img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:3px;
}

/* ===== اسم ابوبيان متعدد الألوان ===== */
.watermark{
    position:absolute;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    z-index:15;
    pointer-events:none;
    white-space:nowrap;

    font-size:clamp(18px,4vw,28px);
    font-weight:900;
    letter-spacing:.5px;

    background:linear-gradient(
        90deg,
        #ff1744,
        #ff9100,
        #ffe600,
        #00e676,
        #00b0ff,
        #7c4dff,
        #ff1744
    );
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:rainbow 5s linear infinite;

    filter:drop-shadow(0 2px 5px rgba(0,0,0,.85));
}

@keyframes rainbow{
    to{background-position:300% center}
}

/* ===== معلومات القناة ===== */
.channel-info{
    max-width:1100px;
    margin:8px auto 0;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:46px;
    padding:9px 12px;
    background:linear-gradient(135deg,#111925,#0d131e);
    border:1px solid var(--border);
    border-radius:12px;
}

.live-dot{
    width:10px;
    height:10px;
    flex:none;
    border-radius:50%;
    background:#ff1744;
    box-shadow:0 0 12px #ff1744;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{opacity:.35;transform:scale(.75)}
}

#now{
    flex:1;
    min-width:0;
    text-align:right;
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ===== أزرار التنقل ===== */
.nav{
    max-width:1100px;
    margin:8px auto 0;
    display:grid;
    grid-template-columns:1fr 1.2fr 1fr;
    gap:8px;
}

button{
    border:1px solid rgba(255,255,255,.1);
    border-radius:11px;
    padding:12px 10px;
    color:#fff;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#1a2331,#111722);
    transition:transform .18s,background .18s,border .18s;
}

button:hover:not(:disabled){
    transform:translateY(-1px);
    background:linear-gradient(135deg,#252f40,#171f2d);
    border-color:rgba(255,255,255,.22);
}

button:active:not(:disabled){
    transform:scale(.98);
}

button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#prev{color:#dbe4f0}
#next{color:#dbe4f0}

#liveBtn{
    background:linear-gradient(135deg,#e50914,#a70009);
    border-color:rgba(255,255,255,.15);
}

/* ===== المحتوى ===== */
.main{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px 12px 40px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:linear-gradient(135deg,#e50914,#ff7a00);
    font-size:21px;
    box-shadow:0 7px 22px rgba(229,9,20,.25);
}

h1{
    margin:0;
    font-size:21px;
}

.subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
}

.count{
    color:#fff;
    background:#171f2c;
    border:1px solid var(--border);
    border-radius:20px;
    padding:7px 10px;
    font-size:12px;
    white-space:nowrap;
}

.status-box{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    margin-bottom:12px;
    color:#b8c2d1;
    background:#0e141f;
    border:1px solid var(--border);
    border-radius:11px;
    font-size:13px;
}

.title{
    position:relative;
    overflow:hidden;
    margin-bottom:9px;
    padding:13px 15px;
    border-radius:12px;
    background:linear-gradient(135deg,#171f2c,#101722);
    border:1px solid var(--border);
    font-size:15px;
    font-weight:bold;
}

.title::before{
    content:"";
    display:inline-block;
    width:4px;
    height:18px;
    margin-left:8px;
    vertical-align:-4px;
    border-radius:5px;
    background:linear-gradient(#ff1744,#ff9100,#00b0ff);
}

#channels{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:8px;
}

.channel{
    position:relative;
    min-height:70px;
    padding:9px 11px;
    display:flex;
    align-items:center;
    gap:11px;
    border:1px solid var(--border);
    border-radius:11px;
    background:linear-gradient(135deg,#121925,#0e141e);
    cursor:pointer;
    color:#e8edf5;
    font-size:14px;
    font-weight:bold;
    transition:.2s;
    overflow:hidden;
}

.channel-logo{
    width:48px;
    height:48px;
    flex:none;
    object-fit:contain;
    border-radius:10px;
    background:#080b12;
    border:1px solid rgba(255,255,255,.1);
    padding:4px;
}

.channel-name{
    min-width:0;
    line-height:1.45;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.channel:hover{
    transform:translateY(-2px);
    border-color:rgba(229,9,20,.45);
    background:linear-gradient(135deg,#1a2331,#121925);
}

.channel.active{
    border-color:rgba(229,9,20,.7);
    background:linear-gradient(135deg,#4a1117,#191923);
    box-shadow:0 0 0 1px rgba(229,9,20,.12),0 7px 22px rgba(229,9,20,.12);
}

.channel.active::before{
    content:"●";
    color:#ff1744;
    margin-left:7px;
    text-shadow:0 0 9px #ff1744;
}

.empty{
    grid-column:1/-1;
    padding:30px;
    text-align:center;
    color:#8793a5;
    background:#0e141f;
    border:1px dashed #2a3444;
    border-radius:12px;
}

/* ===== الجوال ===== */
@media(max-width:600px){
    video{
        min-height:200px;
        max-height:48vh;
    }

    .watermark{
        bottom:9px;
        font-size:18px;
    }

    .logo-link{
        width:50px;
        height:50px;
        top:8px;
        left:8px;
        border-radius:10px;
    }

    .nav{
        grid-template-columns:1fr 1fr;
    }

    #liveBtn{
        grid-column:1/-1;
        grid-row:1;
    }

    #prev{grid-column:1}
    #next{grid-column:2}

    #channels{
        grid-template-columns:1fr;
    }

    h1{font-size:18px}
}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#080b12}
::-webkit-scrollbar-thumb{
    background:#2a3444;
    border-radius:10px;
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
/* =================================
   رابط M3U
   يمكنك تغييره لاحقاً
================================= */
const M3U_URL =
"https://raw.githubusercontent.com/almaystro619/almaystro69/refs/heads/main/checked-working%20(1).m3u";


const video = document.getElementById("video");
const box = document.getElementById("channels");
const status = document.getElementById("status");
const now = document.getElementById("now");
const count = document.getElementById("count");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let list = [];
let index = -1;
let hls = null;

/* صورة افتراضية للقنوات التي لا تحتوي على tvg-logo */
const FALLBACK_LOGO =
    "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/96px-Google_2015_logo.svg.png";

window.addEventListener("load", loadM3U);


/* =================================
   تحميل القائمة
================================= */
async function loadM3U(){

    status.textContent = "جاري تحميل القنوات...";

    try{

        const response = await fetch(M3U_URL, {
            cache:"no-store"
        });

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const text = await response.text();

        parseM3U(text);

    }catch(error){

        console.error(error);

        status.innerHTML =
        "❌ تعذر تحميل قائمة القنوات — تأكد من رابط M3U أو السماح بـ CORS";

        box.innerHTML =
        '<div class="empty">لا توجد قنوات يمكن عرضها حالياً</div>';

        count.textContent = "0 قناة";
    }
}


/* =================================
   تحليل M3U
================================= */
function parseM3U(text){

    const lines = text.split(/\r?\n/);

    let name = "";
    let logo = "";
    list = [];

    box.innerHTML = "";

    for(let i=0; i<lines.length; i++){

        const line = lines[i].trim();

        if(line.startsWith("#EXTINF")){

            const comma = line.indexOf(",");

            if(comma !== -1){

                name = line
                    .substring(comma + 1)
                    .trim();

            }

            const logoMatch =
                line.match(/tvg-logo=["']([^"']+)["']/i);

            logo = logoMatch ? logoMatch[1] : "";

        }else if(
            line &&
            !line.startsWith("#") &&
            name
        ){

            list.push({
                name:name,
                url:line,
                logo:logo
            });

            createChannel(
                list.length - 1,
                name,
                logo
            );

            name = "";
            logo = "";
        }
    }

    count.textContent = list.length + " قناة";

    status.textContent =
        "تم تحميل " + list.length + " قناة بنجاح";

    if(list.length === 0){

        box.innerHTML =
        '<div class="empty">لم يتم العثور على قنوات داخل القائمة</div>';

    }

    updateButtons();
}


/* =================================
   إنشاء القناة
================================= */
function createChannel(i, name, logo){

    const channel = document.createElement("div");

    channel.className = "channel";
    channel.id = "channel-" + i;

    const img = document.createElement("img");

    img.className = "channel-logo";

    img.src = logo || FALLBACK_LOGO;

    img.alt = "";

    img.loading = "lazy";

    img.onerror = function(){
        this.src = FALLBACK_LOGO;
    };

    const title = document.createElement("span");

    title.className = "channel-name";

    title.textContent =
        (i + 1) + "  •  " + name;

    channel.appendChild(img);
    channel.appendChild(title);

    channel.onclick = function(){
        playChannel(i);
    };

    box.appendChild(channel);
}


/* =================================
   تشغيل القناة
================================= */
function playChannel(i){

    if(i < 0 || i >= list.length){
        return;
    }

    index = i;

    const channel = list[i];

    if(hls){
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    now.textContent =
        "📺 " + channel.name;

    document
        .querySelectorAll(".channel")
        .forEach(function(item){
            item.classList.remove("active");
        });

    const active =
        document.getElementById("channel-" + i);

    if(active){

        active.classList.add("active");

        active.scrollIntoView({
            behavior:"smooth",
            block:"nearest"
        });
    }

    const url = channel.url;

    if(url.toLowerCase().includes(".m3u8")){

        if(Hls.isSupported()){

            hls = new Hls({
                enableWorker:true,
                lowLatencyMode:true
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function(){
                    video.play().catch(function(){});
                }
            );

            hls.on(
                Hls.Events.ERROR,
                function(event,data){

                    if(data.fatal){
                        console.warn("HLS error:", data);
                    }
                }
            );

        }else if(
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ){

            video.src = url;

            video.play().catch(function(){});
        }

    }else{

        video.src = url;

        video.play().catch(function(){});
    }

    updateButtons();
}


/* =================================
   السابقة
================================= */
function previous(){

    if(index > 0){
        playChannel(index - 1);
    }
}


/* =================================
   التالية
================================= */
function next(){

    if(index < list.length - 1){
        playChannel(index + 1);
    }
}


/* =================================
   القناة الحالية
================================= */
function goLive(){

    if(index >= 0){

        const active =
            document.getElementById("channel-" + index);

        if(active){

            active.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });
        }
    }else{

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });
    }
}


/* =================================
   تحديث الأزرار
================================= */
function updateButtons(){

    prevBtn.disabled =
        index <= 0;

    nextBtn.disabled =
        index < 0 ||
        index >= list.length - 1;
}


/* =================================
   تنظيف HLS عند مغادرة الصفحة
================================= */
window.addEventListener("beforeunload", function(){

    if(hls){
        hls.destroy();
    }
});
</script>
